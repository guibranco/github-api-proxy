# NGINX site for github-api-proxy, written by bootstrap.sh with the domains filled in.
# Add TLS afterwards with: certbot --nginx -d __PROXY_DOMAIN__ -d __ADMIN_DOMAIN__
#
# The allow-list is enforced by the proxy itself (Network:AllowedSources in Grimoire, refreshed
# live); NGINX passes the real client address in X-Forwarded-For. Ports must match
# Proxy:ListenAddr / Proxy:AdminListenAddr (defaults 127.0.0.1:8080 / 127.0.0.1:8081).

# Proxy: clients use https://__PROXY_DOMAIN__ as their GitHub API base URL.
server {
    listen 80;
    listen [::]:80;
    server_name __PROXY_DOMAIN__;

    client_max_body_size 100m;          # large GraphQL bodies, blob creation, release notes

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;            # stream responses straight through
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/github-api-proxy.access.log;
    error_log  /var/log/nginx/github-api-proxy.error.log;
}

# Stats API (Projects Monitor), /health and Swagger UI at /swagger/.
server {
    listen 80;
    listen [::]:80;
    server_name __ADMIN_DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/github-api-proxy-admin.access.log;
    error_log  /var/log/nginx/github-api-proxy-admin.error.log;
}
