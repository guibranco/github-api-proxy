name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The job name is the status check a `main` ruleset can require ("build").
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: "6.x"

      - name: 🏷️ Determine Version Number
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

      - name: 🐹 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: 🎨 Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt needed on: ${unformatted}"
            exit 1
          fi

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🧪 Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: 📊 Coverage summary
        if: always()
        run: |
          if [[ -f coverage.out ]]; then
            { echo '### Coverage'; echo '```'; go tool cover -func=coverage.out | tail -n 15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🐚 ShellCheck deploy scripts
        run: shellcheck deploy/scripts/*.sh

      - name: 🏗️ Build linux/amd64 and linux/arm64
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${arch}/github-api-proxy" ./cmd/github-api-proxy
          done
          ./dist/amd64/github-api-proxy --version
          echo "Would release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
